<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="signin-body">
    <div class="signin-logo">
        <a href="./index.html"><img src="./assets/amazon_logo_dark.png" width="150" alt="Amazon Logo"></a>
    </div>

    <div class="signin-container">
        <h1>Sign in</h1>
        <form class="signin-form">
            <label for="email">Email or mobile phone number</label>
            <input type="text" id="email">
            <button type="submit">Continue</button>
            <p class="signin-terms">By continuing, you agree to Amazon's <a>Conditions of Use</a> and <a>Privacy Notice</a>.</p>
            <p class="signin-help"><a>Need help?</a></p>
        </form>
    </div>

    <div class="signin-divider">
        <hr>
        <p>New to Amazon?</p>
        <hr>
    </div>

    <button class="create-account-btn">Create your Amazon account</button>

    <footer class="signin-footer">
        <a>Conditions of Use</a>
        <a>Privacy Notice</a>
        <a>Help</a>
        <p>© 1996-2024, Amazon.com, Inc. or its affiliates</p>
    </footer>
</body>
</html>
